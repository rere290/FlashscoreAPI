plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.github.brunomndantas'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {

	// SPRING BOOT
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	// TEST
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// REST ASSURED
	testImplementation 'io.rest-assured:rest-assured:5.4.0'
	testImplementation 'io.rest-assured:json-path:5.4.0'
	testImplementation 'io.rest-assured:xml-path:5.4.0'

	// MOCKITO
	testImplementation 'org.mockito:mockito-core:5.7.0'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.7.0'

	// LOMBOK
	compileOnly 'org.projectlombok:lombok:1.18.36'
	annotationProcessor 'org.projectlombok:lombok:1.18.36'

	// TPL4J
	implementation 'com.github.brunomndantas:tpl4j:1.2.1'

	// Repository4J
	implementation 'com.github.brunomndantas:repository4j:1.0.0'

	// JScrapper
	implementation 'com.github.brunomndantas:jscrapper:1.1.1'

	// COMMONS IO
	implementation 'commons-io:commons-io:2.11.0'

	// APACHE COMMONS
	implementation 'org.apache.commons:commons-text:1.10.0'
	implementation 'org.apache.commons:commons-lang3:3.12.0'

	// HIBERNATE VALIDATOR
	implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

	// JAKARTA
	implementation 'jakarta.el:jakarta.el-api:5.0.1'

	// SELENIUM
	implementation('org.seleniumhq.selenium:selenium-java:4.47.0') {
		force = true
	}

	// SWAGGER
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

	// API COMMON
	implementation 'com.google.api:api-common:2.14.1'
}

// ======================================================
// FORCE SELENIUM 4.47.0
// Empêche une autre dépendance de ramener Selenium 4.14.1
// ======================================================

configurations.configureEach {
	resolutionStrategy {
		force 'org.seleniumhq.selenium:selenium-java:4.47.0'
		force 'org.seleniumhq.selenium:selenium-api:4.47.0'
		force 'org.seleniumhq.selenium:selenium-chrome-driver:4.47.0'
		force 'org.seleniumhq.selenium:selenium-chromium-driver:4.47.0'
		force 'org.seleniumhq.selenium:selenium-remote-driver:4.47.0'
		force 'org.seleniumhq.selenium:selenium-manager:4.47.0'
		force 'org.seleniumhq.selenium:selenium-support:4.47.0'
		force 'org.seleniumhq.selenium:selenium-devtools-v131:4.47.0'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
